# Slicer 3D (OrcaSlicer) pour Synology - MODÈLE.
# Le docker-compose.yml publié (Release "synology") est généré à partir de ce
# fichier par .github/scripts/generer-compose-synology.py, qui y intègre les
# fichiers de guacamole/, fichiers/ et proxy/ : un seul fichier sur le NAS.
#
#   navigateur ──► [proxy] ──(réseau "isole", internal: true)──► [guacamole] ─► [guacd] ─VNC/SFTP─► [orcaslicer]
#
# - TOUT passe par Apache Guacamole, en HTTP simple, SANS AUCUN websocket
#   (passe les proxys d'entreprise) : affichage d'OrcaSlicer (VNC) et
#   transfert de fichiers (SFTP, dossier /echange).
# - Le NAS télécharge les images ; les CONTENEURS restent sans Internet
#   (réseau "isole" sans passerelle) et sans accès aux dossiers du NAS.

name: slicer3d

services:
  # OrcaSlicer dans un écran virtuel, exposé en VNC (5900) et SFTP (22) sur le
  # seul réseau isolé. Image construite depuis orcaslicer-vnc/ par GitHub Actions.
  orcaslicer:
    image: ghcr.io/nathan33670-spec/slicer3d-orcaslicer-vnc:latest
    container_name: slicer3d-orcaslicer
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1026}
      PGID: ${PGID:-100}
      TZ: ${TZ:-Europe/Paris}
      RESOLUTION: ${RESOLUTION:-1920x1080}
      SFTP_PASSWORD: ${SLICER_PASSWORD:-}
    volumes:
      - slicer-config:/config          # réglages, profils (volume Docker interne)
      - echange:/echange               # fichiers échangés via Guacamole (SFTP)
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    networks:
      - isole

  # Moteur de Guacamole : se connecte au VNC du slicer.
  guacd:
    image: guacamole/guacd:latest
    container_name: slicer3d-guacd
    restart: unless-stopped
    networks:
      - isole

  # Application web Guacamole (connexion par identifiant / mot de passe).
  guacamole:
    image: guacamole/guacamole:latest
    container_name: slicer3d-guacamole
    restart: unless-stopped
    depends_on:
      - guacd
      - orcaslicer
    environment:
      GUACD_HOSTNAME: guacd
      WEBAPP_CONTEXT: ROOT
      SLICER_USER: ${SLICER_USER:-}
      SLICER_PASSWORD: ${SLICER_PASSWORD:-}
      SFTP_PASSWORD: ${SLICER_PASSWORD:-}
    networks:
      - isole


  # Seul conteneur joignable depuis le réseau local.
  proxy:
    image: nginx:1.27-alpine
    container_name: slicer3d-proxy
    restart: unless-stopped
    depends_on:
      - guacamole
    ports:
      - "${BIND_IP:-0.0.0.0}:${HTTP_PORT:-3003}:3003"    # Guacamole (slicer + fichiers)
    security_opt:
      - no-new-privileges:true
    networks:
      - isole
      - acces

  # Vérification de l'isolation, à lancer à la demande :
  #   docker compose run --rm verification
  verification:
    image: nginx:1.27-alpine
    profiles: ["verification"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Test depuis le réseau du slicer (réseau isole)..."
        ok=1
        for cible in http://1.1.1.1 http://example.com https://www.google.com; do
          if wget -q -T 6 -O /dev/null "$$cible" 2>/dev/null; then
            echo "  ÉCHEC : $$cible est joignable !"; ok=0
          else
            echo "  OK    : $$cible injoignable"
          fi
        done
        if [ $$ok = 1 ]; then echo "RÉSULTAT : isolé, aucun accès Internet."; else echo "RÉSULTAT : PAS isolé !"; exit 1; fi
    networks:
      - isole

volumes:
  slicer-config:
  echange:

networks:
  isole:
    internal: true
  acces:
    driver: bridge
