# Relais TCP brut (couche 4) : le navigateur parle directement au serveur
# web du slicer (HTTP, HTTPS et WebSocket passent tels quels) et vers la
# page d'échange de fichiers.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    # DNS interne de Docker : permet au proxy de démarrer même si le
    # slicer n'est pas encore prêt, et de le retrouver s'il redémarre.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $server_port $backend {
        3000 orcaslicer:3000;
        3001 orcaslicer:3001;
        3002 fichiers:8080;
    }

    server {
        listen 3000;
        proxy_pass $backend;
        proxy_timeout 24h;
    }

    server {
        listen 3001;
        proxy_pass $backend;
        proxy_timeout 24h;
    }

    server {
        listen 3002;
        proxy_pass $backend;
        proxy_timeout 1h;
    }
}
