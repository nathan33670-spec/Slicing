# Relais HTTP vers Guacamole (variante Synology), port 3003.
#
# AUCUN websocket :
#  - une ligne est injectée au début de la page de Guacamole pour retirer
#    le websocket du navigateur ; Guacamole utilise alors directement son
#    tunnel HTTP (requêtes HTTP courtes), qui passe les proxys d'entreprise ;
#  - par sécurité, l'adresse du websocket de Guacamole est bloquée ici.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log off;
    client_max_body_size 4g;
    proxy_http_version 1.1;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_request_buffering off;

    # DNS interne de Docker (le proxy démarre même si Guacamole est absent)
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 3003;
        set $guacamole guacamole:8080;

        location = /websocket-tunnel {
            return 403;
        }

        location / {
            proxy_pass http://$guacamole;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            # Nécessaire pour pouvoir modifier la page (pas de compression)
            proxy_set_header Accept-Encoding "";

            # Retire le websocket du navigateur avant le chargement de Guacamole
            sub_filter_once on;
            sub_filter '<head>' '<head><script>try{window.WebSocket=undefined;}catch(e){}</script>';
        }
    }
}
