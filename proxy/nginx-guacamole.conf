# Relais HTTP (variante Guacamole) :
#   port 3000 -> Guacamole (bureau OrcaSlicer dans le navigateur)
#   port 3002 -> page d'échange de fichiers
#
# Le websocket de Guacamole est volontairement BLOQUÉ : le navigateur bascule
# alors sur le tunnel HTTP de Guacamole (requêtes HTTP courtes), qui passe
# les proxys d'entreprise qui coupent les websockets.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log off;
    client_max_body_size 4g;
    proxy_http_version 1.1;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_request_buffering off;

    # DNS interne de Docker (le proxy démarre même si un service est absent)
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 3000;
        set $guacamole guacamole:8080;

        location = /websocket-tunnel {
            return 403;
        }

        location / {
            proxy_pass http://$guacamole;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
        }
    }

    server {
        listen 3002;
        set $fichiers fichiers:8080;

        location / {
            proxy_pass http://$fichiers;
            proxy_buffering off;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
        }
    }
}
