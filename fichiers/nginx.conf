# Service "fichiers" : page web pour envoyer / récupérer des fichiers dans le
# volume d'échange (/echange), qui est aussi monté dans le slicer.
user nginx;
worker_processes 1;
pid /tmp/nginx-fichiers.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;

    client_max_body_size 4g;
    client_body_timeout 1h;
    send_timeout 1h;

    server {
        listen 8080;
        include /tmp/auth.conf;

        root /fichiers/www;

        location = / {
            try_files /index.html =404;
        }

        # Liste (JSON), envoi (PUT), suppression (DELETE), nouveau dossier (MKCOL)
        location /api/ {
            alias /echange/;
            autoindex on;
            autoindex_format json;
            dav_methods PUT DELETE MKCOL;
            create_full_put_path on;
            dav_access user:rw group:rw all:rw;
        }

        # Téléchargement (force l'enregistrement plutôt que l'affichage)
        location /telecharger/ {
            alias /echange/;
            add_header Content-Disposition "attachment";
        }
    }
}
